plugins {
    // Minecraft 26.x is unobfuscated: no mappings, no "mod*" configurations.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = uri('https://maven.dimaskama.net/releases') }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.dimaskama:mcef-modern:${project.mcef_modern_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Prints the real MCEF Modern API into the build log (before compiling),
// so the bridge code can be matched to it exactly.
tasks.register('dumpMcefApi') {
    doLast {
        def jarFile = configurations.compileClasspath.files.find {
            it.name.startsWith('mcef-modern') && !it.name.contains('sources')
        }
        println "=== MCEF API DUMP START ==="
        println "MCEF jar: ${jarFile}"
        if (jarFile != null) {
            def zip = new java.util.zip.ZipFile(jarFile)
            def classes = zip.entries().toList()
                .findAll { it.name.startsWith('net/dimaskama/mcef/api/') && it.name.endsWith('.class') && !(it.name =~ /\$\d/) }
                .collect { it.name.replace('.class', '').replace('/', '.') }
            zip.close()
            println "classes: ${classes}"
            def pb = new ProcessBuilder(['javap', '-p', '-cp', jarFile.absolutePath] + classes)
            pb.redirectErrorStream(true)
            println pb.start().inputStream.text
        }
        println "=== MCEF API DUMP END ==="
    }
}
tasks.named('compileJava') { dependsOn 'dumpMcefApi' }
