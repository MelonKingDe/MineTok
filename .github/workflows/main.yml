name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you start it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # The project has no gradlew, so Gradle is provided here.
      # 'current' = latest stable Gradle. If Loom complains, pin e.g. gradle-version: '9.3.0'.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-scroll-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
